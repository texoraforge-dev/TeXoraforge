<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/texora_app_logo_1786115622051.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TeXora Forge - School Academic Management Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('TeXora Service Worker registered for offline execution:', reg.scope))
            .catch(err => console.warn('Service Worker registration skipped or failed:', err));
        });
      }
    </script>
  </body>
</html>
